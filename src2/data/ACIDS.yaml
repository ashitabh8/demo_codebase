        finetune_audio_resnet_from_pretrain:
                model: "teacher_audio_resnet18"
                training: "finetune_supcon"
                task_name: vehicle_classification
                dataloader: acids_vehicle
                fixed_augmenters:
                        time_augmenters: ["time_mask"]
                        freq_augmenters: ["freq_mask"]
                checkpoint_path: "/PLEASE_SET_ACIDS_PRETRAIN/best_pretrain_model.pth"

        finetune_audio_deepsense_dw_large_mel:
                model: "student_audio_deepsense_dw_large_mel"
                training: "finetune_ce"
                task_name: vehicle_classification
                dataloader: acids_vehicle
                preprocess_mode: "mel"
                fixed_augmenters:
                        time_augmenters: ["time_mask"]
                        freq_augmenters: ["freq_mask"]
                checkpoint_path: "/PLEASE_SET_ACIDS_PRETRAIN/best_pretrain_model.pth"

        finetune_audio_deepsense_dw_large_mel_supcon:
                model: "student_audio_deepsense_dw_large_mel"
                training: "finetune_supcon"
                task_name: vehicle_classification
                dataloader: acids_vehicle
                preprocess_mode: "mel"
                fixed_augmenters:
                        time_augmenters: ["scaling", "time_mask", "time_mask"]
                        freq_augmenters: ["freq_mask", "freq_mask"]
                checkpoint_path: "/PLEASE_SET_ACIDS_PRETRAIN/best_pretrain_model.pth"

        finetune_audio_deepsense_dw_large_mel_supcon_difflr:
                model: "student_audio_deepsense_dw_large_mel"
                training: "finetune_supcon_difflr"
                task_name: vehicle_classification
                dataloader: acids_vehicle
                preprocess_mode: "mel"
                fixed_augmenters:
                        time_augmenters: ["scaling", "time_mask", "time_mask"]
                        freq_augmenters: ["freq_mask", "freq_mask"]
                checkpoint_path: "/PLEASE_SET_ACIDS_PRETRAIN/best_pretrain_model.pth"


# =============================================================================
# Original Teacher Model Configs
# =============================================================================
ResNet:
        # Architecture settings
        block_type: "basic"  # "basic" for ResNet18/34, "bottleneck" for ResNet50+
        layers: [2, 2, 2, 2]  # ResNet18
        # layers: [3, 4, 6, 3]  # ResNet34
        # layers: [3, 4, 6, 3]  # ResNet50 (with block_type: "bottleneck")
        dropout_ratio: 0.2
        fc_dim: 256

        fixed_augmenters:
                time_augmenters: ["no"]
                freq_augmenters: ["no"]

        
        # Quantization config

        


                

# DeepSense config
DeepSense:
        dropout_ratio: 0.2
        # single interval + location + modality
        loc_mod_in_conv_stride:
                audio: [1, 4]
                seismic: [1, 4]
        loc_mod_conv_lens: 
                audio: [[1, 4], [1, 4], [1, 4]]
                seismic: [[1, 4], [1, 4], [1, 4]]
        loc_mod_out_channels: 128
        loc_mod_conv_inter_layers: 4
        # single interval + location
        loc_conv_lens: [[1, 4], [1, 4], [1, 4]]
        loc_out_channels: 128
        loc_conv_inter_layers: 3
        # recurrent layer
        recurrent_dim: 128
        recurrent_layers: 2
        # FC layer
        fc_dim: 256
        pretrained_head: "linear"
        # Optimizer config
        optimizer:
                name: "AdamW"
                start_lr: 0.0001
                warmup_lr: 0.000001
                min_lr: 0.000001
                clip_grad: 5.0
                weight_decay: 0.05
        # LR scheduler
        lr_scheduler:
                name: "cosine"
                warmup_prefix: True
                warmup_epochs: 0
                train_epochs: 1000
                start_epoch: 0
                decay_epochs: 200
                decay_rate: 0.2
        # Data Augmenters:
        random_augmenters:
                time_augmenters: ["permutation", "negation", "time_warp", "horizontal_flip", "mag_warp", "scaling", "jitter", "channel_shuffle"]
                freq_augmenters: ["phase_shift"]
        fixed_augmenters:
                time_augmenters: ["channel_shuffle", "mixup"]
                freq_augmenters: ["phase_shift"]

TransformerV4:
        dropout_ratio: 0.2
        drop_path_rate: 0.1
        attn_drop_rate: 0.2
        # loc mod freq feature
        in_stride:
                audio: 1
                seismic: 1
        # single modality
        time_freq_out_channels: 64
        time_freq_head_num: 4
        time_freq_block_num: 
                audio: [2, 2, 4]
                seismic: [2, 2, 4]
        # modality fusion
        mod_out_channels: 256
        mod_head_num: 4
        mod_block_num: 2
        # location fusion
        loc_out_channels: 256 # loc_out_channels == mod_out_channels
        loc_head_num: 4
        loc_block_num: 2
        # SwinTransformer configs
        window_size: 
                audio: [2, 4] 
                seismic: [2, 4] 
        mlp_ratio: 4.
        qkv_bias: True
        APE: False
        patch_norm: True
        patch_size:
                freq:
                        audio: [1, 8]
                        seismic: [1, 8]
        # FC layer
        fc_dim: 512
        pretrained_head: "linear"
        # Optimizer config
        optimizer:
                name: "AdamW"
                start_lr: 0.00001
                warmup_lr: 0.000001
                min_lr: 0.0000001
                clip_grad: 5.0
                weight_decay: 0.05
        # LR scheduler
        lr_scheduler:
                name: "cosine"
                warmup_prefix: True
                warmup_epochs: 0
                train_epochs: 1000
                start_epoch: 0
                decay_epochs: 200
                decay_rate: 0.2
        # Data Augmenters:
        random_augmenters:
                time_augmenters: ["permutation", "negation", "time_warp", "horizontal_flip", "mag_warp", "scaling", "jitter", "channel_shuffle"]
                freq_augmenters: ["phase_shift"]
        fixed_augmenters:
                time_augmenters: ["channel_shuffle", "mixup"]
                freq_augmenters: ["phase_shift"]

# ------------------------------------------- Data Augmenter Configs ------------------------------------------
# Mixup config
mixup:
        mixup_alpha: 1.0
        cutmix_alpha: 1.0
        cutmix_minmax: null
        prob: 0.5
        switch_prob: 1 # prob of switch to cutmix
        mode: 'random_batch'
        label_smoothing: 0

jitter:
        std_in_percent: 3
        prob: 0.5

rotation:
        angles: [90, 180, 270]

permutation:
        prob: 0.5

scaling:
        prob: 0.5
        std: 0.3

time_warp:
        prob: 0.5
        magnitude: 0.2
        order: 6

mag_warp:
        prob: 0.5
        magnitude: 0.2
        order: 4

negation:
        prob: 0.5

channel_shuffle:
        prob: 0.5

freq_mask:
        prob: 0.5 
        mask_ratio: 0.3

time_mask:
        prob: 0.5
        mask_ratio: 0.3

phase_shift:
        prob: 0.5 

horizontal_flip:
        prob: 0.5

cross_entropy:
        name: "cross_entropy"

label_smoothing_ce:
        name: "label_smoothing_ce"
        label_smoothing: 0.1

kurtosis:
        name: "kurtosis"
        kurtosis_weight: 0.1
        kurtosis_target: 1.8
        kurtosis_eps: 1e-8

importance_vector_loss:
        name: "importance_vector_loss"
        lambda_variance: 0.1
        variance_metric: "loss" # Not used anymore
        target_avg_bitwidth: 6.0
        budget_coeff: 0.01

loss_name: "cross_entropy"

repetition: 3

batch_size_pretrain: 256
batch_size: 32
num_workers: 4
use_balanced_sampling: True

base_experiment_dir: /home/misra8/demo_codebase/src2/experiments

# Normalization
# Options: "standard", "minmax", "maxabs", "none"
# for DynamicQuantization only use "minmax" because it supports unsigned quantization,
# so negative values are not supported
normalization:
        method: "minmax"  # Use MinMaxScaler (scale to range)
        minmax_range: [0, 1]  # Only used when method is "minmax"

# Preprocessing mode: "fft" (default) or "mel"
sample_rate: 16000
n_fft: 1600
mel_bins: 80
mel_fmin: 20.0
mel_fmax: 8000.0

# Segments
num_segments: 7

# Locations 
num_location: 1
location_names: ["shake"]

# Modality names
num_sensors: 2
modality_names: ["seismic", "audio"]

# Location modalities
loc_modalities: 
        shake: ["seismic", "audio"]
loc_mod_in_freq_channels:
        shake:
                audio: 6
                seismic: 4
loc_mod_in_time_channels:
        shake:
                audio: 3
                seismic: 2
loc_mod_spectrum_len:
        shake:
                audio: 256
                seismic: 256

# For sequence-based contrastive learning 
seq_len: 4

# =============================================================================
# Model Zoo: Reusable Model Definitions
# =============================================================================
# Define models once, reference them by name in distillation experiments.
# Each model can be a teacher or student depending on how it's used.

models:
        # Teacher: Audio-only ResNet18 (standard floating point, no early exits)
        # This should be a pre-trained model that we load from checkpoint
        teacher_audio_resnet18:
                model_source: "create_single_modal_model"
                model_type: "resnet_simple"
                active_modality: "audio"
                layers: [2, 2, 2, 2]  # Standard ResNet18
                filter_sizes: [64, 128, 256, 512]  # Standard ResNet18 filters
                stem_kernel: 7
                stem_stride: 2
                use_maxpool: true
                dropout_ratio: 0.2
                fc_dim: 512
                weight_only_qat: false
                weight_only_bits: 4
        
        # Student 1: Audio-only ResNet (~757 KB)
        student_audio_resnet:
                model_source: "create_single_modal_model"
                model_type: "resnet_simple"
                active_modality: "audio"
                layers: [2, 2, 2 ,2]
                filter_sizes: [16, 32, 48, 96]
                stem_kernel: 3
                stem_stride: 1
                use_maxpool: false
                dropout_ratio: 0.1
                fc_dim: 64
                # weight_only_qat: true
                # weight_only_bits: 2

        
        # Probe: ~10MB ResNet for sizing
        probe_resnet_10mb:
                model_source: "create_single_modal_model"
                model_type: "resnet_simple"
                active_modality: "audio"
                layers: [2, 2, 2, 2]
                filter_sizes: [32, 64, 128, 256]
                stem_kernel: 5
                stem_stride: 1
                use_maxpool: false
                dropout_ratio: 0.2
                fc_dim: 128

        # Student 2: Audio-only ConvOnly (~730 KB)
        student_audio_convonly:
                model_source: "create_single_modal_model"
                model_type: "convonly"
                active_modality: "audio"
                num_blocks: [2, 2, 2, 2]
                filter_sizes: [16, 32, 48, 96]
                kernel_sizes: [3, 3, 3, 3]
                strides: [1, 2, 2, 2]
                stem_kernel: 3
                stem_stride: 1
                dropout_ratio: 0.1
                fc_dim: 64

        # Audio-only DeepSense (small — 1 GRU layer)
        student_audio_deepsense_small:
                model_source: "create_single_modal_model"
                model_type: "deepsense"
                active_modality: "audio"
                channels: [32, 64, 64]
                kernel_sizes: [[1, 80], [1, 5], [1, 5]]
                strides: [[1, 80], [1, 1], [1, 1]]
                recurrent_dim: 64
                recurrent_layers: 1
                fc_dim: 128
                dropout_ratio: 0.2
                proj_hidden_dim: 256
                proj_out_dim: 128

        # Audio-only DeepSense (standard)
        student_audio_deepsense:
                model_source: "create_single_modal_model"
                model_type: "deepsense"
                active_modality: "audio"
                channels: [64, 128, 128]
                kernel_sizes: [[1, 80], [1, 5], [1, 5]]
                strides: [[1, 80], [1, 1], [1, 1]]
                recurrent_dim: 256
                recurrent_layers: 2
                fc_dim: 512
                dropout_ratio: 0.2
                proj_hidden_dim: 256
                proj_out_dim: 128

        # DeepSense DW ~200KB for ACIDS (256-bin FFT audio, 6 ch)
        student_audio_deepsense_dw_tiny:
                model_source: "create_single_modal_model"
                model_type: "deepsense_dw"
                active_modality: "audio"
                channels_freq: [32, 64, 96]
                kernel_sizes_freq: [[1, 8], [1, 5], [1, 3]]
                strides_freq: [[1, 8], [1, 4], [1, 2]]
                temporal_channels: 64
                num_temporal_layers: 4
                temporal_kernel: 3
                fc_dim: 64
                dropout_ratio: 0.15
                proj_hidden_dim: 128
                proj_out_dim: 64

        student_audio_deepsense_dw_large_mel:
                model_source: "create_single_modal_model"
                model_type: "deepsense_dw"
                active_modality: "audio"
                in_channels: 1       # Mel: single magnitude channel
                in_spectrum_len: 80  # 80 Mel bins
                channels_freq:     [128, 256, 512, 512, 512]
                kernel_sizes_freq: [[1, 5], [1, 3], [1, 3], [1, 3], [1, 3]]
                strides_freq:      [[1, 2], [1, 2], [1, 1], [1, 1], [1, 1]]
                temporal_channels: 512
                num_temporal_layers: 6
                temporal_kernel: 3
                fc_dim: 512
                dropout_ratio: 0.35
                proj_hidden_dim: 256
                proj_out_dim: 128

        student_audio_deepsense_dw_large_mel_bigru:
                model_source: "create_single_modal_model"
                model_type: "deepsense_dw"
                active_modality: "audio"
                in_channels: 1
                in_spectrum_len: 80
                channels_freq:     [128, 256, 512, 512, 512]
                kernel_sizes_freq: [[1, 5], [1, 3], [1, 3], [1, 3], [1, 3]]
                strides_freq:      [[1, 2], [1, 2], [1, 1], [1, 1], [1, 1]]
                temporal_channels: 512
                num_temporal_layers: 6
                temporal_kernel: 3
                use_bigru: True
                recurrent_dim: 192
                recurrent_layers: 2
                output_dims: [512, 256]
                fc_dim: 512
                dropout_ratio: 0.35
                proj_hidden_dim: 256
                proj_out_dim: 128

        student_audio_deepsense_dw_mel:
                model_source: "create_single_modal_model"
                model_type: "deepsense_dw"
                active_modality: "audio"
                in_channels: 1       # Mel: single magnitude channel
                in_spectrum_len: 80  # 80 Mel bins
                channels_freq:     [64, 128, 256]
                kernel_sizes_freq: [[1, 5], [1, 3], [1, 3]]
                strides_freq:      [[1, 2], [1, 2], [1, 1]]
                temporal_channels: 256
                num_temporal_layers: 4
                temporal_kernel: 3
                fc_dim: 512
                dropout_ratio: 0.2
                proj_hidden_dim: 256
                proj_out_dim: 128


# =============================================================================
# Training Config Zoo: Reusable Training Recipes
# =============================================================================
# Define training procedures once, reference them by name in experiments.
# Each config specifies type, epochs, loss, optimizer, and lr_scheduler.

training_configs:
        vanilla_supervised_ce:
                type: "vanilla_supervised"
                epochs: 50
                loss_name: "cross_entropy"
                optimizer:
                        name: "AdamW"
                        start_lr: 0.0001
                        warmup_lr: 0.000001
                        min_lr: 0.000001
                        clip_grad: 5.0
                        weight_decay: 0.05
                lr_scheduler:
                        name: "cosine"
                        warmup_prefix: True
                        warmup_epochs: 0
                        decay_epochs: 2
                        decay_rate: 0.2

        vanilla_supervised_contrastive:
                type: "vanilla_supervised_contrastive"
                epochs: 200
                loss_name: "ce_supcon"
                supcon_temperature: 0.07
                supcon_weight: 1.0
                optimizer:
                        name: "AdamW"
                        start_lr: 0.0001
                        warmup_lr: 0.000001
                        min_lr: 0.000001
                        clip_grad: 5.0
                        weight_decay: 0.05
                lr_scheduler:
                        name: "cosine"
                        warmup_prefix: True
                        warmup_epochs: 0
                        decay_epochs: 2
                        decay_rate: 0.2

        distill_resnet18_to_resnet:
                type: "distillation"
                teacher_model: "teacher_audio_resnet18"
                temperature: 4.0
                alpha: 0.5
                epochs: 50
                loss_name: "kd_loss"
                optimizer:
                        name: "AdamW"
                        start_lr: 0.001
                        warmup_lr: 0.00001
                        min_lr: 0.00001
                        clip_grad: 5.0
                        weight_decay: 0.01
                lr_scheduler:
                        name: "cosine"
                        warmup_prefix: True
                        warmup_epochs: 5

        distill_resnet_to_convonly:
                type: "distillation"
                teacher_model: "student_audio_resnet"
                temperature: 4.0
                alpha: 0.5
                epochs: 100
                loss_name: "kd_loss"
                optimizer:
                        name: "AdamW"
                        start_lr: 0.001
                        warmup_lr: 0.00001
                        min_lr: 0.00001
                        clip_grad: 5.0
                        weight_decay: 0.01
                lr_scheduler:
                        name: "cosine"
                        warmup_prefix: True
                        warmup_epochs: 5

        qat_4bit_from_checkpoint:
                type: "qat_from_checkpoint"
                checkpoint_path: ""      # fill in at run time
                weight_only_bits: 4
                epochs: 30
                loss_name: "cross_entropy"
                optimizer:
                        name: "AdamW"
                        start_lr: 0.00005
                        warmup_lr: 0.000001
                        min_lr: 0.000001
                        clip_grad: 5.0
                        weight_decay: 0.05
                lr_scheduler:
                        name: "cosine"
                        warmup_prefix: True
                        warmup_epochs: 0

        ssl_pretrain_ce:
                type: "ssl_pretrain"
                epochs: 50
                loss_name: "nt_xent"
                nt_xent_temperature: 0.2
                pretrain_subset_ratio: 1.0
                pretrain_subset_mode: "global"
                pretrain_seed: 42
                viz_every_n_epochs: 10
                optimizer:
                        name: "AdamW"
                        start_lr: 0.0003
                        warmup_lr: 0.000001
                        min_lr: 0.000001
                        clip_grad: 5.0
                        weight_decay: 0.05
                lr_scheduler:
                        name: "cosine"
                        warmup_prefix: True
                        warmup_epochs: 10
                        decay_epochs: 2
                        decay_rate: 0.2

        finetune_ce:
                type: "finetune"
                epochs: 100
                loss_name: "cross_entropy"
                freeze_backbone: True
                optimizer:
                        name: "AdamW"
                        start_lr: 0.0001
                        warmup_lr: 0.000001
                        min_lr: 0.000001
                        clip_grad: 5.0
                        weight_decay: 0.05
                lr_scheduler:
                        name: "cosine"
                        warmup_prefix: True
                        warmup_epochs: 0
                        decay_epochs: 5
                        decay_rate: 0.5

        finetune_supcon:
                type: "finetune"
                epochs: 100
                loss_name: "ce_supcon"
                supcon_temperature: 0.07
                supcon_weight: 1.0
                freeze_backbone: True
                optimizer:
                        name: "AdamW"
                        start_lr: 0.0001
                        warmup_lr: 0.000001
                        min_lr: 0.000001
                        clip_grad: 5.0
                        weight_decay: 0.05
                lr_scheduler:
                        name: "cosine"
                        warmup_prefix: True
                        warmup_epochs: 0
                        decay_epochs: 5
                        decay_rate: 0.5

        finetune_supcon_difflr:
                type: "finetune"
                epochs: 100
                loss_name: "ce_supcon"
                supcon_temperature: 0.07
                supcon_weight: 1.0
                freeze_backbone: True
                backbone_lr_scale: 0.01
                optimizer:
                        name: "AdamW"
                        start_lr: 0.0003
                        warmup_lr: 0.000001
                        min_lr: 0.000001
                        clip_grad: 5.0
                        weight_decay: 0.05
                lr_scheduler:
                        name: "cosine"
                        warmup_prefix: True
                        warmup_epochs: 5
                        decay_epochs: 5
                        decay_rate: 0.5

        finetune_bce_multilabel_difflr:
                type: "finetune"
                epochs: 100
                loss_name: "bce_multilabel"
                multilabel_best_metric: "mAP" # "val_loss"
                freeze_backbone: True
                backbone_lr_scale: 0.01
                optimizer:
                        name: "AdamW"
                        start_lr: 0.0003
                        warmup_lr: 0.000001
                        min_lr: 0.000001
                        clip_grad: 5.0
                        weight_decay: 0.05
                lr_scheduler:
                        name: "cosine"
                        warmup_prefix: True
                        warmup_epochs: 5
                        decay_epochs: 5
                        decay_rate: 0.5

# =============================================================================
# Experiments
# =============================================================================
# Each experiment maps a student model to a training config.
# Use -experiment_name <key> to select which experiment to run.

experiments:
        enabled: true

        only_audio_resnet18:
                model: "student_audio_resnet"
                training: "vanilla_supervised_ce"
                task_name: vehicle_classification
                dataloader: acids_legacy_multiclass

        cascade_stage1:
                model: "student_audio_resnet"
                training: "distill_resnet18_to_resnet"
                task_name: vehicle_classification
                dataloader: acids_legacy_multiclass

        cascade_stage2:
                model: "student_audio_convonly"
                training: "distill_resnet_to_convonly"
                task_name: vehicle_classification
                dataloader: acids_legacy_multiclass

        # --- single_label_only + supervised contrastive (primary DeepSense DW tiny) ---
        only_audio_deepsense_dw_tiny:
                model: "student_audio_deepsense_dw_tiny"
                training: "vanilla_supervised_contrastive"
                task_name: vehicle_classification
                dataloader: acids_vehicle
                preprocess_mode: "fft"
                fixed_augmenters:
                        time_augmenters: ["time_mask"]
                        freq_augmenters: ["freq_mask"]

        only_audio_resnet18_single_label:
                model: "student_audio_resnet"
                training: "vanilla_supervised_ce"
                task_name: vehicle_classification
                dataloader: acids_vehicle
                preprocess_mode: "fft"
                fixed_augmenters:
                        time_augmenters: ["no"]
                        freq_augmenters: ["no"]

        only_audio_resnet18_supcon:
                model: "teacher_audio_resnet18"
                training: "vanilla_supervised_contrastive"
                task_name: vehicle_classification
                dataloader: acids_vehicle
                fixed_augmenters:
                        time_augmenters: ["time_mask"]
                        freq_augmenters: ["freq_mask"]

        cascade_stage1_single_label:
                model: "student_audio_resnet"
                training: "distill_resnet18_to_resnet"
                task_name: vehicle_classification
                dataloader: acids_vehicle
                fixed_augmenters:
                        time_augmenters: ["time_mask"]
                        freq_augmenters: ["freq_mask"]

        cascade_stage2_single_label:
                model: "student_audio_convonly"
                training: "distill_resnet_to_convonly"
                task_name: vehicle_classification
                dataloader: acids_vehicle
                fixed_augmenters:
                        time_augmenters: ["time_mask"]
                        freq_augmenters: ["freq_mask"]

        only_audio_deepsense_small:
                model: "student_audio_deepsense_small"
                training: "vanilla_supervised_ce"
                task_name: vehicle_classification
                dataloader: acids_vehicle
                fixed_augmenters:
                        time_augmenters: ["no"]
                        freq_augmenters: ["no"]

        only_audio_deepsense:
                model: "student_audio_deepsense"
                training: "vanilla_supervised_contrastive"
                task_name: vehicle_classification
                dataloader: acids_vehicle
                fixed_augmenters:
                        time_augmenters: ["time_mask"]
                        freq_augmenters: ["freq_mask"]

        only_audio_deepsense_dw_mel:
                model: "student_audio_deepsense_dw_mel"
                training: "vanilla_supervised_contrastive"
                task_name: vehicle_classification
                dataloader: acids_vehicle
                preprocess_mode: "mel"
                fixed_augmenters:
                        time_augmenters: ["time_mask"]
                        freq_augmenters: ["freq_mask"]

        only_audio_deepsense_dw_large_mel:
                model: "student_audio_deepsense_dw_large_mel"
                training: "vanilla_supervised_contrastive"
                task_name: vehicle_classification
                dataloader: acids_vehicle
                preprocess_mode: "mel"
                fixed_augmenters:
                        time_augmenters: ["scaling", "time_mask", "time_mask"]
                        freq_augmenters: ["freq_mask", "freq_mask"]

        pretrain_audio_resnet:
                model: "teacher_audio_resnet18"
                training: "ssl_pretrain_ce"
                fixed_augmenters:
                        time_augmenters: ["scaling", "time_mask", "time_mask"]
                        freq_augmenters: ["freq_mask"]

        pretrain_audio_student_resnet:
                model: "student_audio_resnet"
                training: "ssl_pretrain_ce"
                fixed_augmenters:
                        time_augmenters: ["scaling", "time_mask", "negation"]
                        freq_augmenters: ["freq_mask", "phase_shift"]

        pretrain_audio_deepsense_dw_large_mel:
                model: "student_audio_deepsense_dw_large_mel"
                training: "ssl_pretrain_ce"
                preprocess_mode: "mel"
                fixed_augmenters:
                        time_augmenters: ["scaling", "time_mask", "time_mask"]
                        freq_augmenters: ["freq_mask"]

        pretrain_audio_deepsense_dw_large_mel_bigru:
                model: "student_audio_deepsense_dw_large_mel_bigru"
                training: "ssl_pretrain_ce"
                preprocess_mode: "mel"
                fixed_augmenters:
                        time_augmenters: ["scaling", "time_mask", "time_mask"]
                        freq_augmenters: ["freq_mask"]

        # Finetune: set checkpoint_path to your best_pretrain_model.pth before running
        finetune_audio_deepsense_dw_large_mel_bigru:
                model: "student_audio_deepsense_dw_large_mel_bigru"
                training: "finetune_supcon"
                task_name: vehicle_classification
                dataloader: acids_vehicle
                preprocess_mode: "mel"
                fixed_augmenters:
                        time_augmenters: ["scaling", "time_mask", "time_mask"]
                        freq_augmenters: ["freq_mask"]

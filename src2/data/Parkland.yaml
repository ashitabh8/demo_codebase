MobileNetV2:
        # Architecture settings
        width_mult: 1.0
        dropout_ratio: 0.2
        fc_dim: 256

  # Optimizer config
        optimizer:
                name: "AdamW"
                start_lr: 0.0001
                warmup_lr: 0.000001
                min_lr: 0.000001
                clip_grad: 5.0
                weight_decay: 0.05

  # LR scheduler
        lr_scheduler:
                name: "cosine"
                warmup_prefix: True
                warmup_epochs: 0
                train_epochs: 50
                start_epoch: 0
                decay_epochs: 2
                decay_rate: 0.2

        fixed_augmenters:
                time_augmenters: ["no"]
                freq_augmenters: ["no"]

# DeepSense config
DeepSense:
        dropout_ratio: 0.2 
        # single interval + location + modality
        loc_mod_in_conv_stride:
                audio: [1, 80]
                seismic: [1, 1]
        loc_mod_conv_lens: 
                audio: [[1, 80], [1, 5], [1, 5]]
                seismic: [[1, 3], [1, 3], [1, 3]]
        loc_mod_out_channels: 128
        loc_mod_conv_inter_layers: 4
        # single interval + location
        loc_conv_lens: [[1, 4], [1, 4], [1, 4]]
        loc_out_channels: 128
        loc_conv_inter_layers: 3
        # recurrent layer
        recurrent_dim: 256
        recurrent_layers: 2
        # FC layer
        fc_dim: 512
        pretrained_head: "linear"
        # Optimizer config
        optimizer:
                name: "AdamW"
                start_lr: 0.0001
                warmup_lr: 0.000001
                min_lr: 0.0000001
                clip_grad: 5.0
                weight_decay: 0.05
        # LR scheduler
        lr_scheduler:
                name: "step"
                warmup_prefix: True
                warmup_epochs: 0
                train_epochs: 500
                start_epoch: 0
                decay_epochs: 300
                decay_rate: 0.2
        # Augmenters
        random_augmenters:
                time_augmenters: ["no"]
                freq_augmenters: ["phase_shift"]
        fixed_augmenters:
                time_augmenters: ["mixup"]
                freq_augmenters: ["no"]

TransformerV4:
        dropout_ratio: 0.2
        drop_path_rate: 0.1
        attn_drop_rate: 0.2
        # loc mod freq feature
        in_stride:
                audio: 1
                seismic: 1
        # single modality
        time_freq_out_channels: 64
        time_freq_head_num: 4
        time_freq_block_num: 
                audio: [2, 2, 4]
                seismic: [2, 2, 4]
        # modality fusion
        mod_out_channels: 256
        mod_head_num: 4
        mod_block_num: 2
        # location fusion
        loc_out_channels: 256 # loc_out_channels == mod_out_channels
        loc_head_num: 4
        loc_block_num: 2
        # SwinTransformer configs
        window_size: 
                audio: [3, 3] 
                seismic: [3, 3] 
        mlp_ratio: 4.
        qkv_bias: True
        APE: False
        patch_norm: True
        patch_size:
                freq:
                        audio: [1, 40]
                        seismic: [1, 1]
        # FC layer
        fc_dim: 512
        pretrained_head: "linear"
        # Optimizer config
        optimizer:
                name: "AdamW"
                start_lr: 0.0001
                warmup_lr: 0.000001
                min_lr: 0.0000001
                clip_grad: 5.0
                weight_decay: 0.05
        # LR scheduler
        lr_scheduler:
                name: "cosine"
                warmup_prefix: True
                warmup_epochs: 0
                train_epochs: 500
                start_epoch: 0
                decay_epochs: 100
                decay_rate: 0.2
        # Data Augmenters:
        random_augmenters:
                time_augmenters: ["no"]
                freq_augmenters: ["no"]
        fixed_augmenters:
                time_augmenters: ["no"]
                freq_augmenters: ["phase_shift"]

CifarResNet:
        # Architecture settings
        model_name: "resnet20"  # Options: resnet20, resnet32, resnet44, resnet56, resnet110
        initial_channels: 16    # Default is 16 (CIFAR standard), use 32 for wider networks
        dropout_ratio: 0.2
        fc_dim: 256

        # Optimizer config
        optimizer:
                name: "AdamW"
                start_lr: 0.0001
                warmup_lr: 0.000001
                min_lr: 0.000001
                clip_grad: 5.0
                weight_decay: 0.05

        # LR scheduler
        lr_scheduler:
                name: "cosine"
                warmup_prefix: True
                warmup_epochs: 0
                train_epochs: 50
                start_epoch: 0
                decay_epochs: 2
                decay_rate: 0.2

        fixed_augmenters:
                time_augmenters: ["no"]
                freq_augmenters: ["no"]

# ------------------------------------------- Data Augmenter Configs ------------------------------------------
# Mixup config
mixup:
        mixup_alpha: 1.0
        cutmix_alpha: 1.0
        cutmix_minmax: null
        prob: 1.0
        switch_prob: 0.75
        mode: 'random_batch'
        label_smoothing: 0
        num_classes: 7

jitter:
        std_in_percent: 0.2
        prob: 0.5

rotation:
        angles: [90, 180, 270]

permutation:
        prob: 0.5

scaling:
        prob: 0.8
        std: 0.35

time_warp:
        prob: 0.5
        magnitude: 0.2
        order: 6

mag_warp:
        prob: 0.5
        magnitude: 0.05
        order: 4

negation:
        prob: 0.5

channel_shuffle:
        prob: 0.5

freq_mask:
        prob: 0.8 
        mask_ratio: 0.2

time_mask:
        prob: 0.8
        mask_ratio: 0.4

phase_shift:
        prob: 0.8

horizontal_flip:
        prob: 0.5

# Legacy band_limited_noise config (use audio_noise_augmentation instead)
band_limited_noise:
        prob: 0.5
        noise_std: 0.5
        noise_range: "full_spectrum"
        target_modality: "audio"

# ============================================================================
# Audio Noise Augmentation Configuration (Unified Soft + Hard Noise)
# ============================================================================
audio_noise_augmentation:
        target_modality: "audio"  # Only apply to audio
        
        # ---------------------------------------------------------------------
        # Soft Noise (Band-Limited Gaussian) - "Easy Mode"
        # ---------------------------------------------------------------------
        soft_noise:
                enabled: false
                prob: 0.5
                mode: "some_overlap"  # Options: "no_overlap", "some_overlap", "full_spectrum"
                # Single value OR list for random selection per batch during training
                noise_std: [0.2, 0.3, 0.4, 0.5]  # Randomly picks one per batch
                modes:
                        no_overlap:
                                freq_range: [500, 800]
                        some_overlap:
                                freq_range: [200, 500]
                        full_spectrum:
                                freq_range: [0, 800]
        
        # ---------------------------------------------------------------------
        # Hard Noise (Environmental) - Wind/Rain
        # ---------------------------------------------------------------------
        hard_noise:
                enabled: false
                prob: 0.5
                mode: "rain"  # Options: "wind", "rain"
                
                # Wind noise parameters
                wind:
                        # Single value OR list for random selection per batch
                        intensity: [0.2, 0.3, 0.4, 0.5]  # Randomly picks one per batch
                        low_freq_weight: 1.5     # Low frequency emphasis (0.5-5.0)
                        high_freq_cutoff: 0.25   # Rolloff point (0.0-1.0 of Nyquist)
                        turbulence_factor: 0.4   # Wind gust variation (0.0-1.0)
                
                # Rain noise parameters
                rain:
                        # Single value OR list for random selection per batch
                        intensity: [0.2, 0.3, 0.4, 0.5]  # Randomly picks one per batch
                        droplet_rate: 0.3        # Temporal sparsity (0.0-0.8)
                        high_freq_emphasis: 2.0  # High frequency boost (1.0-3.0)
                        splash_sharpness: 0.6    # Transient sharpness (0.0-0.9)
